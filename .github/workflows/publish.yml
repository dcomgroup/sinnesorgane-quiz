name: Publish learning app
on:
  push:
    branches: [main]
    paths:
      - 'sinnesorgane_quiz_kompakt.zip'
      - '.github/workflows/publish.yml'
      - 'practice.js'
      - 'card_text_fixes.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app
        run: |
          mkdir -p _site
          unzip -q -o sinnesorgane_quiz_kompakt.zip -d _site
          test -f _site/index.html
          test -f _site/cards.json
          test "$(find _site/images -type f | wc -l)" -eq 104
          python3 - <<'PY'
          from pathlib import Path
          import json
          cards_path=Path('_site/cards.json')
          cards=json.loads(cards_path.read_text(encoding='utf-8'))
          fixes=json.loads(Path('card_text_fixes.json').read_text(encoding='utf-8'))
          found=set()
          for card in cards:
            if card['id'] in fixes:
              card['info']=fixes[card['id']]
              found.add(card['id'])
          assert found==set(fixes), f'Missing cards: {set(fixes)-found}'
          cards_path.write_text(json.dumps(cards,ensure_ascii=False,indent=2),encoding='utf-8')
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          script=Path('practice.js').read_text(encoding='utf-8')
          html=html.replace('</html>', '<script>'+script+'</script></html>')
          p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
